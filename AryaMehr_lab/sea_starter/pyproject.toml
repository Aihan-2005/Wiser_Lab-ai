[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-sea"
version = "0.1.0"
description = "Configurable SEA-style baseline for Persian/Iranian Sign Language alignment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.0",
  "PyYAML>=6.0",
  "webvtt-py>=0.4.6",
  "pysrt>=1.1.2"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
persian-sea-segment = "persian_sea.cli.segment:main"
persian-sea-align = "persian_sea.cli.align:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
