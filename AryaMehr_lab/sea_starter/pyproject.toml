[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-sea"
version = "0.2.0"
description = "Persian/Iranian Sign Language SEA-style segmentation baseline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.0",
  "PyYAML>=6.0",
  "pose-format>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
persian-sea-pose = "persian_sea.cli.pose:main"
persian-sea-segment = "persian_sea.cli.segment:main"
persian-sea-validate-segments = "persian_sea.cli.validate_segments:main"
persian-sea-eval-segments = "persian_sea.cli.eval_segments:main"
persian-sea-tune-segments = "persian_sea.cli.tune_segments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
